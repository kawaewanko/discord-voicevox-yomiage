services:
  voicevox:
    build:
      context: ./docker/voicevox
      dockerfile: Dockerfile
      args:
        VOICEVOX_BASE_IMAGE: ${VOICEVOX_BASE_IMAGE:-voicevox/voicevox_engine:cpu-latest}
    image: discord-voicevox-yomiage/voicevox:cpu
    restart: unless-stopped
    environment:
      VV_CPU_NUM_THREADS: ${VV_CPU_NUM_THREADS:-2}
    expose:
      - "50021"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:50021/version >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${BOT_IMAGE:-discord-voicevox-yomiage/bot:local}
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      VOICEVOX_URL: http://voicevox:50021
      DATA_DIR: /app/data
      PORT: 3000
    depends_on:
      voicevox:
        condition: service_healthy
    ports:
      - "${HEALTH_PORT:-3000}:3000"
    volumes:
      - bot-data:/app/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  bot-data:
    name: ${COMPOSE_PROJECT_NAME:-discord-voicevox-yomiage}-data
