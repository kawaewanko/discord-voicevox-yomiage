x-bot-environment: &bot-environment
  NODE_ENV: production
  VOICEVOX_URL: http://voicevox:50021
  DATA_DIR: /app/data
  MAINTENANCE_STATE_FILE: /app/maintenance/maintenance-state.json
  PORT: 3000

x-bot-common: &bot-common
  build:
    context: .
    dockerfile: Dockerfile
  image: ${BOT_IMAGE:-discord-voicevox-yomiage/bot:local}
  restart: unless-stopped
  init: true
  env_file:
    - .env
  environment: *bot-environment
  depends_on:
    voicevox:
      condition: service_healthy
  healthcheck:
    test:
      - CMD-SHELL
      - >-
        node -e "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 20s

services:
  voicevox:
    build:
      context: ./docker/voicevox
      dockerfile: Dockerfile
      args:
        VOICEVOX_BASE_IMAGE: ${VOICEVOX_BASE_IMAGE:-voicevox/voicevox_engine:cpu-latest}
    image: discord-voicevox-yomiage/voicevox:cpu
    restart: unless-stopped
    environment:
      VV_CPU_NUM_THREADS: ${VV_CPU_NUM_THREADS:-2}
    expose:
      - "50021"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:50021/version >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  bot:
    <<: *bot-common
    ports:
      - "${HEALTH_PORT:-3000}:3000"
    volumes:
      - bot-data:/app/data
      - maintenance-state:/app/maintenance

  bot-1:
    <<: *bot-common
    profiles: ["bot-1"]
    environment:
      <<: *bot-environment
      DISCORD_TOKEN: ${BOT_1_DISCORD_TOKEN:-}
      CLIENT_ID: ${BOT_1_CLIENT_ID:-}
      GUILD_ID: ${BOT_1_GUILD_ID:-}
      MAINTENANCE_MODE: ${BOT_1_MAINTENANCE_MODE:-false}
    ports:
      - "${BOT_1_HEALTH_PORT:-3001}:3000"
    volumes:
      - bot-data-1:/app/data
      - maintenance-state:/app/maintenance

